title: Hae jeong's Blog
email:
description: >
  공부한 내용을 기록하는 블로그
baseurl: "" # 사용자 사이트(907hza.github.io)는 하위 경로가 없으므로 비워둠
url: "https://907hza.github.io"
postCount: 5 # 메인 페이지에 보여줄 글 개수
timezone: Asia/Seoul

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
markdown_ext: markdown,mkdown,mkdn,mkd,md
permalink: /:year/:title/

plugins:
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE
  - screenshot.png
  - vendor
